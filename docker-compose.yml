services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memory_museum
      POSTGRES_USER: memory_museum
      POSTGRES_PASSWORD: memory_museum_local
    ports:
      - "54324:5432"
    volumes:
      - memory_museum_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_museum -d memory_museum"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - memory_museum_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://memory_museum:memory_museum_local@db:5432/memory_museum
      OBJECT_STORAGE_MODE: minio
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9004
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OBJECT_STORAGE_BUCKET: memory-museum
      PUBLIC_APP_ORIGIN: http://localhost:3104
      CURATOR_PROVIDER: deterministic
    ports:
      - "8104:8104"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  memory_museum_postgres:
  memory_museum_minio:
